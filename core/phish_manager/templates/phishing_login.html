<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in – IT Department</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 48px 40px 40px;
      width: 100%;
      max-width: 400px;
    }
    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #1d4ed8;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 20px;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: #1d4ed8; }
    button[type="submit"] {
      width: 100%;
      padding: 11px;
      background: #1d4ed8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    button[type="submit"]:hover { background: #1e40af; }
    .footer {
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">&#127968; CompanyPortal</div>
    <div class="subtitle">IT Department — Employee Login</div>

    <form method="POST" action="/phish/submit/">
      {% csrf_token %}
      <input type="hidden" name="event_id" value="{{ event_id }}">

      <label for="email">Work email</label>
      <input type="email" id="email" name="email" placeholder="you@company.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>

      <button type="submit">Sign in</button>
    </form>

    <div class="footer">© 2025 Company IT Department · Secure login</div>
  </div>
</body>
</html>
